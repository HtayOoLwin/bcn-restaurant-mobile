name: Cashier Bill Card Check

on:
  push:
    branches:
      - bcn-restaurant-mobile-without-kitchen-monitor
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile/bcn_restaurant_mobile
        run: flutter pub get

      - name: Run cashier screen tests
        working-directory: mobile/bcn_restaurant_mobile
        run: flutter test test/features/cashier/cashier_screen_test.dart

      - name: Run full Flutter test suite
        working-directory: mobile/bcn_restaurant_mobile
        run: flutter test
