name: Apply Cashier Action Visibility

on:
  push:
    branches:
      - bcn-restaurant-mobile-without-kitchen-monitor

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cashier card action placement
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mobile/bcn_restaurant_mobile/lib/features/cashier/presentation/cashier_screen.dart')
          text = path.read_text()

          header_marker = """            ),
            if (_expanded) ...[
              if (bill.lastPrintStatus?.isNotEmpty == true) ...["""
          header_replacement = """            ),
            if (isBilling && !_expanded) ...[
              const SizedBox(height: 12),
              _actionButtons(isBilling),
            ],
            if (_expanded) ...[
              if (bill.lastPrintStatus?.isNotEmpty == true) ...["""
          if header_marker not in text:
              raise SystemExit('Header marker not found')
          text = text.replace(header_marker, header_replacement, 1)

          row_start = text.index("""              Row(
                children: [
                  Expanded(
                    child: FilledButton.icon(
                      style: FilledButton.styleFrom(
                        backgroundColor: _reprintBlue,""")
          row_end_token = """              ),
            ],"""
          row_end = text.index(row_end_token, row_start)
          text = text[:row_start] + "              _actionButtons(isBilling),\n" + text[row_end + len("              ),\n"):]

          class_end_marker = """    );
  }
}

double _parseTender"""
          helper = """    );
  }

  Widget _actionButtons(bool isBilling) {
    return Row(
      children: [
        Expanded(
          child: FilledButton.icon(
            style: FilledButton.styleFrom(
              backgroundColor: _reprintBlue,
              foregroundColor: Colors.white,
              disabledBackgroundColor: _disabledBackground,
              disabledForegroundColor: _disabledForeground,
              padding: const EdgeInsets.symmetric(vertical: 14),
            ),
            onPressed: isBilling && !widget.printPending
                ? widget.onPrint
                : null,
            icon: widget.printPending
                ? const SizedBox(
                    width: 18,
                    height: 18,
                    child: CircularProgressIndicator(strokeWidth: 2),
                  )
                : const Icon(Icons.print),
            label: Text(
              widget.printPending ? 'Sending…' : 'Reprint Bill',
            ),
          ),
        ),
        const SizedBox(width: 12),
        Expanded(
          child: FilledButton.icon(
            style: FilledButton.styleFrom(
              backgroundColor: _paymentGreen,
              foregroundColor: Colors.white,
              disabledBackgroundColor: _disabledBackground,
              disabledForegroundColor: _disabledForeground,
              padding: const EdgeInsets.symmetric(vertical: 14),
            ),
            onPressed: isBilling ? widget.onPayment : null,
            icon: const Icon(Icons.point_of_sale),
            label: const Text('Payment'),
          ),
        ),
      ],
    );
  }
}

double _parseTender"""
          if class_end_marker not in text:
              raise SystemExit('Class end marker not found')
          text = text.replace(class_end_marker, helper, 1)

          path.write_text(text)
          PY

      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "HtayOoLwin"
          git config user.email "htayoo.lwin@bcncl.com"
          git add mobile/bcn_restaurant_mobile/lib/features/cashier/presentation/cashier_screen.dart
          git commit -m "feat: show billing actions while cashier card is collapsed"
          git push origin HEAD:bcn-restaurant-mobile-without-kitchen-monitor
