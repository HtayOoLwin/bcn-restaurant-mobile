name: Verify without kitchen monitor

on:
  push:
    branches:
      - bcn-restaurant-mobile-without-kitchen-monitor

jobs:
  backend-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/bcn_restaurant_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
