name: Patch Cashier Tests

on:
  push:
    branches:
      - bcn-restaurant-mobile-without-kitchen-monitor

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update cashier print tests for collapsed cards
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mobile/bcn_restaurant_mobile/test/features/settings/settings_screen_test.dart')
          text = path.read_text()

          wrapped_old = """      await tester.pumpWidget(_cashierHarness(repository));
          await tester.pumpAndSettle();

          await tester.tap(find.text('Reprint Bill'));"""
          wrapped_new = """      await tester.pumpWidget(_cashierHarness(repository));
          await tester.pumpAndSettle();
          await _expandCashierBill(tester);

          await tester.tap(find.text('Reprint Bill'));"""
          if wrapped_old in text:
              text = text.replace(wrapped_old, wrapped_new, 1)

          plain_old = """    await tester.pumpWidget(_cashierHarness(repository));
              await tester.pumpAndSettle();
              await tester.tap(find.text('Reprint Bill'));"""
          plain_new = """    await tester.pumpWidget(_cashierHarness(repository));
              await tester.pumpAndSettle();
              await _expandCashierBill(tester);
              await tester.tap(find.text('Reprint Bill'));"""
          text = text.replace(plain_old, plain_new, 2)

          helper = """
          Future<void> _expandCashierBill(WidgetTester tester) async {
            await tester.tap(find.text('Table 1'));
            await tester.pumpAndSettle();
          }

          """
          marker = 'Widget _cashierHarness(WindowsPrintGateway repository) {'
          if '_expandCashierBill(WidgetTester tester)' not in text:
              text = text.replace(marker, helper + marker, 1)

          path.write_text(text)
          PY

      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "HtayOoLwin"
          git config user.email "htayoo.lwin@bcncl.com"
          git add mobile/bcn_restaurant_mobile/test/features/settings/settings_screen_test.dart
          git commit -m "test: expand cashier card before print actions"
          git push origin HEAD:bcn-restaurant-mobile-without-kitchen-monitor
