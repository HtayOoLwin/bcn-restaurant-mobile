name: Patch Cashier Tests

on:
  push:
    branches:
      - bcn-restaurant-mobile-without-kitchen-monitor

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update cashier print tests for collapsed cards
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mobile/bcn_restaurant_mobile/test/features/settings/settings_screen_test.dart')
          text = path.read_text()
          old = "      await tester.pumpAndSettle();\n\n      await tester.tap(find.text('Reprint Bill'));"
          new = "      await tester.pumpAndSettle();\n      await _expandCashierBill(tester);\n\n      await tester.tap(find.text('Reprint Bill'));"
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "HtayOoLwin"
          git config user.email "htayoo.lwin@bcncl.com"
          git add mobile/bcn_restaurant_mobile/test/features/settings/settings_screen_test.dart
          git commit -m "test: expand first cashier card before print action"
          git push origin HEAD:bcn-restaurant-mobile-without-kitchen-monitor
