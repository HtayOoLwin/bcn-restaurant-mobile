name: Task 8 removal checks

on:
  push:
    branches:
      - bcn-restaurant-mobile-without-kitchen-monitor

permissions:
  contents: read

jobs:
  static-removal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_mobile_without_kitchen_monitor.py tests/test_phase3_mobile_tooling.py
