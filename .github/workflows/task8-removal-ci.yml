name: Task 8 removal checks

on:
  push:
    branches:
      - bcn-restaurant-mobile-without-kitchen-monitor

permissions:
  contents: write

jobs:
  static-removal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Task 8 static and tooling tests
        run: python -m pytest -q tests/test_mobile_without_kitchen_monitor.py tests/test_phase3_mobile_tooling.py
      - name: Backend fast tests
        run: python -m pytest -q

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/bcn_restaurant_mobile
    steps:
      - uses: actions/checkout@v4
      - name: Isolate waiter route test from network providers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test/features/settings/settings_screen_test.dart')
          text = path.read_text(encoding='utf-8')
          import_anchor = "import 'package:bcn_restaurant_mobile/features/settings/presentation/settings_screen.dart';\n"
          imports = "import 'package:bcn_restaurant_mobile/features/notifications/domain/mobile_notification.dart';\nimport 'package:bcn_restaurant_mobile/features/notifications/presentation/mobile_notification_watcher.dart';\nimport 'package:bcn_restaurant_mobile/features/waiter/domain/table_models.dart';\nimport 'package:bcn_restaurant_mobile/features/waiter/presentation/waiter_tables_screen.dart';\n"
          if "features/waiter/presentation/waiter_tables_screen.dart" not in text:
              if import_anchor not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(import_anchor, import_anchor + imports, 1)
          harness_anchor = "      cashierBillingProvider.overrideWith((ref) async => _billing()),\n    ],\n    child: const _RouterTestApp(),\n"
          harness_replacement = "      cashierBillingProvider.overrideWith((ref) async => _billing()),\n      tablesProvider.overrideWith(\n        (ref, serviceType) async => TablesResponse(\n          serviceType: serviceType,\n          customerGroup: '',\n          tables: const [],\n        ),\n      ),\n      mobileNotificationsProvider.overrideWith(\n        (ref) async => const <MobileNotification>[],\n      ),\n    ],\n    child: const _RouterTestApp(),\n"
          if "tablesProvider.overrideWith(" not in text:
              if harness_anchor not in text:
                  raise SystemExit('Router harness anchor not found')
              text = text.replace(harness_anchor, harness_replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/features/settings/settings_screen_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "test: isolate waiter route from live providers"
            git push origin HEAD:bcn-restaurant-mobile-without-kitchen-monitor
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve packages
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Run Flutter tests and capture diagnostics
        id: flutter_tests
        shell: bash
        run: |
          set +e
          flutter test > ../../flutter_test.txt 2>&1
          status=$?
          cat ../../flutter_test.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit Flutter test diagnostics on failure
        if: steps.flutter_tests.outputs.status != '0'
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_test.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture Flutter test diagnostics"
            git push origin HEAD:bcn-restaurant-mobile-without-kitchen-monitor
          fi
      - name: Fail on Flutter test errors
        if: steps.flutter_tests.outputs.status != '0'
        run: exit 1
