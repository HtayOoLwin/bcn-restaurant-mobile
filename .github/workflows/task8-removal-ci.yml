name: Task 8 removal checks

on:
  push:
    branches:
      - bcn-restaurant-mobile-without-kitchen-monitor

permissions:
  contents: write

jobs:
  static-removal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Task 8 static and tooling tests
        run: python -m pytest -q tests/test_mobile_without_kitchen_monitor.py tests/test_phase3_mobile_tooling.py
      - name: Backend fast tests
        run: python -m pytest -q

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/bcn_restaurant_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve packages
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Commit regenerated lockfile and formatting
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/bcn_restaurant_mobile/pubspec.lock mobile/bcn_restaurant_mobile/lib mobile/bcn_restaurant_mobile/test
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Flutter formatting and lockfile"
            git push origin HEAD:bcn-restaurant-mobile-without-kitchen-monitor
          fi
      - name: Analyze
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
