name: Task 8 removal checks

on:
  push:
    branches:
      - bcn-restaurant-mobile-without-kitchen-monitor

permissions:
  contents: read

jobs:
  static-removal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Router has no Kitchen destination
        run: python -m pytest -q tests/test_mobile_without_kitchen_monitor.py::test_mobile_router_has_no_kitchen_monitor_destination
      - name: Navigation has no Kitchen controls
        run: python -m pytest -q tests/test_mobile_without_kitchen_monitor.py::test_waiter_and_cashier_navigation_have_no_kitchen_monitor_controls
      - name: Bootstrap has no Kitchen permission field
        run: python -m pytest -q tests/test_mobile_without_kitchen_monitor.py::test_bootstrap_model_has_no_mobile_kitchen_permission
      - name: Direct-print dependencies and permissions removed
        run: python -m pytest -q tests/test_mobile_without_kitchen_monitor.py::test_android_direct_printing_dependencies_and_permissions_are_removed
      - name: Old Kitchen and direct-print files deleted
        run: python -m pytest -q tests/test_mobile_without_kitchen_monitor.py::test_old_mobile_kitchen_and_direct_print_files_are_deleted
      - name: Mobile SDK requirement
        run: python -m pytest -q tests/test_phase3_mobile_tooling.py::test_mobile_sdk_matches_current_riverpod_requirement
      - name: Android setup script contract
        run: python -m pytest -q tests/test_phase3_mobile_tooling.py::test_android_setup_script_generates_android_and_runs_checks
      - name: Android run script contract
        run: python -m pytest -q tests/test_phase3_mobile_tooling.py::test_android_run_script_passes_base_url_as_dart_define
      - name: Readonly smoke script contract
        run: python -m pytest -q tests/test_phase3_mobile_tooling.py::test_readonly_smoke_script_never_calls_mutating_restaurant_methods
      - name: Site preflight contract
        run: python -m pytest -q tests/test_phase3_mobile_tooling.py::test_site_preflight_checks_bootstrap_read_only_without_kitchen_monitor
      - name: PowerShell continuation contract
        run: python -m pytest -q tests/test_phase3_mobile_tooling.py::test_powershell_scripts_do_not_use_bash_line_continuations
      - name: Manifest patch newline contract
        run: python -m pytest -q tests/test_phase3_mobile_tooling.py::test_android_setup_manifest_patch_uses_real_newline_not_literal_backticks
