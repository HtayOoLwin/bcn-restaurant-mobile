[project]
name = "bcn_restaurant"
authors = [
    { name = "BCN", email = "dev@bcn.local" }
]
description = "BCN Restaurant mobile backend for ERPNext/Frappe v16"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py311"
