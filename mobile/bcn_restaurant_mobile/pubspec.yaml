name: bcn_restaurant_mobile
description: BCN Restaurant mobile client for ERPNext/Frappe v16
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.0
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: 10.0.0
  go_router: ^17.5.0
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/bcn_brand_mark.png
    - assets/images/OurCityLogo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/OurCityLogo.png"
  adaptive_icon_background: "#6B3A14"
  adaptive_icon_foreground: "assets/images/OurCityLogo.png"
  adaptive_icon_foreground_inset: 20

